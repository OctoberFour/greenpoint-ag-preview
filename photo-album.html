  <!-- Page-specific: album lightbox (mirrors how locations.html keeps its map JS inline) -->
  <script>
    (function () {
      'use strict';
      var lb = document.querySelector('[data-lightbox]');
      if (!lb) return;
      var items = Array.prototype.slice.call(document.querySelectorAll('[data-lb-item]'));
      if (!items.length) return;

      var imgEl    = lb.querySelector('[data-lb-img]');
      var capEl    = lb.querySelector('[data-lb-caption]');
      var thumbsEl = lb.querySelector('[data-lb-thumbs]');
      var prevBtn  = lb.querySelector('[data-lb-prev]');
      var nextBtn  = lb.querySelector('[data-lb-next]');
      var closeBtn = lb.querySelector('[data-lb-close]');

      var slides = items.map(function (it) {
        var im = it.querySelector('img');
        return { src: im.getAttribute('src'), alt: im.getAttribute('alt') || '' };
      });
      var idx = 0, lastFocus = null;

      // Build the thumbnail strip from the same photos.
      var thumbBtns = slides.map(function (s, i) {
        var t = document.createElement('button');
        t.type = 'button';
        t.className = 'lightbox__thumb';
        t.setAttribute('aria-label', 'View photo ' + (i + 1));
        var ti = document.createElement('img');
        ti.src = s.src; ti.alt = ''; ti.loading = 'lazy';
        t.appendChild(ti);
        t.addEventListener('click', function () { go(i); });
        thumbsEl.appendChild(t);
        return t;
      });

      function render() {
        var s = slides[idx];
        imgEl.src = s.src;
        imgEl.alt = s.alt;
        if (capEl) capEl.textContent = (idx + 1) + ' / ' + slides.length;
        thumbBtns.forEach(function (b, i) { b.classList.toggle('is-active', i === idx); });
        var active = thumbBtns[idx];
        if (active && active.scrollIntoView) {
          active.scrollIntoView({ inline: 'center', block: 'nearest' });
        }
      }
      function go(i) { idx = (i + slides.length) % slides.length; render(); }
      function open(i) {
        idx = i;
        lastFocus = document.activeElement;
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
        render();
        closeBtn.focus();
      }
      function close() {
        lb.hidden = true;
        document.body.style.overflow = '';
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }

      items.forEach(function (it, i) { it.addEventListener('click', function () { open(i); }); });
      prevBtn.addEventListener('click', function () { go(idx - 1); });
      nextBtn.addEventListener('click', function () { go(idx + 1); });
      closeBtn.addEventListener('click', close);
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
      document.addEventListener('keydown', function (e) {
        if (lb.hidden) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') go(idx - 1);
        else if (e.key === 'ArrowRight') go(idx + 1);
      });
    })();
  </script>
